<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GV Inventario</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="center-wrapper">
        <img src="/static/logo.png" alt="GV Inventario Logo" class="login-logo">
        <div class="card">
            <h2 style="text-align:center;">Inventario</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username"><span class="icon-user"></span> Usuario</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password"><span class="icon-lock"></span> Contraseña</label>
                    <div class="password-group">
                        <input type="password" id="password" name="password" required>
                        <button type="button" id="togglePassword" class="toggle-password" tabindex="-1" aria-label="Mostrar contraseña">
                            <span class="icon-eye"></span>
                        </button>
                    </div>
                </div>
                <button type="submit">Iniciar Sesión</button>
            </form>
            <div id="loginMessage" class="message"></div>
        </div>
    </div>
    <script src="/static/main.js"></script>
</body>
</html>
