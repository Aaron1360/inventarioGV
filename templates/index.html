<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventario GV</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container homepage">
        <h2 style="text-align:center; color:#fbb03b; margin-bottom: 1.5rem;">Inventario GV</h2>
        <div class="controls">
            <label for="storeSelect">Sucursal:</label>
            <select id="storeSelect"></select>
            <button id="reloadBtn">Recargar Inventario</button>
            <button id="downloadBtn" disabled>Descargar CSV</button>
            <button id="logoutBtn" class="logout-btn" style="margin-left:auto;">
                <span class="icon-logout"></span>
            </button>
        </div>
        <div id="tableContainer">
            <table id="inventoryTable">
                <thead>
                    <tr>
                        <th>Línea</th>
                        <th>Nombre</th>
                        <th>Presentación</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data rows will be injected here by main.js -->
                </tbody>
            </table>
        </div>
        <div id="statusMessage" class="message"></div>
    </div>
    <script src="/static/clean_data.js"></script>
    <script src="/static/main.js"></script>
</body>
</html>
