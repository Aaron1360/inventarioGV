<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventario GV</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container homepage">
        <h2 style="text-align:center; color:#fbb03b; margin-bottom: 1.5rem;">Inventario GV</h2>
        <div class="controls">
            <label for="storeSelect">Sucursal:</label>
            <select id="storeSelect"></select>
            <button id="reloadBtn">Recargar Inventario</button>
            <button id="downloadBtn" disabled>Descargar CSV</button>
        </div>
        <div id="tableContainer">
            <table id="inventoryTable">
                <thead>
                    <tr id="tableHeader"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="statusMessage" class="message"></div>
    </div>
    <script src="/static/main.js"></script>
</body>
</html>
